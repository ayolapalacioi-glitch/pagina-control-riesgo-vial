services:
  backend:
    build:
      context: .
      dockerfile: backend_py/Dockerfile
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
      - ./certs:/app/certs
    command: sh /app/backend_py/entrypoint.sh
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PORT=4000
      - FRONTEND_ORIGIN=*
      - USE_MQTT=false
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_TOPIC=yolo/crosswalk/cam-001
      - LAN_IP=10.60.8.116
      - YOLO_MODEL_PATH=yolov8n.pt
      - YOLO_CONF=0.35
      - BILLBOARD_MODE=true
      - RTSP_CAMERA_ENABLE=false
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - mosquitto
      - go2rtc

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"

  go2rtc:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1984:1984"
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
